<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a0000">
    <title>Lottery Bandit 🎰</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 100%);
            color: #ffd700;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ff0000; }
            50% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff0000; }
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 3px 3px 6px #000;
        }

        .subtitle {
            color: #ff6b6b;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .game-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .game-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: 3px solid #ffd700;
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
            color: #ffd700;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .game-btn:hover, .game-btn.active {
            background: linear-gradient(135deg, #ff0000 0%, #ff6b6b 100%);
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffd700;
        }

        .slot-machine {
            background: linear-gradient(135deg, #2a0000 0%, #1a0000 100%);
            border: 5px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }

        .numbers-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .number-ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            border: 3px solid #ffd700;
            animation: spin 0.5s ease-out;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .white-ball {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            color: #000;
        }

        .powerball {
            background: radial-gradient(circle at 30% 30%, #ff0000, #8b0000);
            color: #fff;
        }

        .megaball {
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            color: #000;
        }

        .pull-lever {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #1a0000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .pull-lever:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffd700;
        }

        .pull-lever:active {
            transform: scale(0.95);
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 2px solid #ffd700;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #ffd700;
        }

        .ticket-history {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
        }

        .ticket-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .ticket-numbers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .small-ball {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: bold;
            border: 2px solid #ffd700;
        }

        .mode-toggle {
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .mode-btn {
            padding: 10px 20px;
            margin: 0 5px;
            font-size: 1em;
            font-weight: bold;
            border: 2px solid #ffd700;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #ffd700;
            color: #1a0000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎰 LOTTERY BANDIT 🎰</h1>
        <div class="subtitle">Smart Number Generator</div>
    </div>

    <div class="game-selector">
        <button class="game-btn active" onclick="selectGame('powerball')">Powerball</button>
        <button class="game-btn" onclick="selectGame('megamillions')">Mega Millions</button>
    </div>

    <div class="slot-machine">
        <div class="mode-toggle">
            <span style="color: #ffd700; margin-right: 10px;">Generation Mode:</span>
            <button class="mode-btn active" onclick="setMode('random')">Truly Random</button>
            <button class="mode-btn" onclick="setMode('hot')">Hot Numbers</button>
        </div>

        <div class="numbers-display" id="numbersDisplay">
            <div class="number-ball white-ball">?</div>
            <div class="number-ball white-ball">?</div>
            <div class="number-ball white-ball">?</div>
            <div class="number-ball white-ball">?</div>
            <div class="number-ball white-ball">?</div>
            <div class="number-ball powerball">?</div>
        </div>

        <button class="pull-lever" onclick="generateTicket()">🎰 PULL THE LEVER! 🎰</button>

        <div class="stats">
            <div class="stat-row">
                <span>Tickets Generated:</span>
                <span id="ticketCount">0</span>
            </div>
            <div class="stat-row">
                <span>Current Game:</span>
                <span id="currentGame">Powerball</span>
            </div>
            <div class="stat-row">
                <span>Mode:</span>
                <span id="currentMode">Truly Random</span>
            </div>
        </div>
    </div>

    <div class="ticket-history" id="ticketHistory"></div>

    <script>
        // Hot numbers based on historical frequency
        const hotNumbers = {
            powerball: {
                white: [32, 41, 16, 23, 28, 39, 22, 63, 61, 69],
                bonus: [24, 18, 4, 13, 10, 3, 9, 11, 22, 6]
            },
            megamillions: {
                white: [31, 17, 46, 20, 4, 10, 38, 14, 42, 15],
                bonus: [22, 11, 18, 9, 13, 24, 3, 7, 4, 10]
            }
        };

        let currentGame = 'powerball';
        let currentMode = 'random';
        let ticketCount = 0;
        let tickets = [];

        // Load saved data
        if (localStorage.getItem('lotteryBanditTickets')) {
            tickets = JSON.parse(localStorage.getItem('lotteryBanditTickets'));
            ticketCount = tickets.length;
            document.getElementById('ticketCount').textContent = ticketCount;
            renderTicketHistory();
        }

        function selectGame(game) {
            currentGame = game;
            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const gameName = game === 'powerball' ? 'Powerball' : 'Mega Millions';
            document.getElementById('currentGame').textContent = gameName;

            // Update display
            const display = document.getElementById('numbersDisplay');
            display.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                display.innerHTML += '<div class="number-ball white-ball">?</div>';
            }
            const bonusClass = game === 'powerball' ? 'powerball' : 'megaball';
            display.innerHTML += `<div class="number-ball ${bonusClass}">?</div>`;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const modeName = mode === 'random' ? 'Truly Random' : 'Hot Numbers';
            document.getElementById('currentMode').textContent = modeName;
        }

        function generateTrulyRandom(max, count) {
            const numbers = [];
            while (numbers.length < count) {
                const num = Math.floor(Math.random() * max) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }
            return numbers.sort((a, b) => a - b);
        }

        function generateHotBiased(max, count) {
            const hot = hotNumbers[currentGame].white;
            const numbers = [];

            while (numbers.length < count) {
                let num;
                if (Math.random() < 0.6 && numbers.length < 3) {
                    // 60% chance to pick from hot numbers for first 3
                    num = hot[Math.floor(Math.random() * hot.length)];
                } else {
                    // Use clustering around hot numbers
                    const baseNum = hot[Math.floor(Math.random() * hot.length)];
                    const offset = Math.floor(Math.random() * 5) - 2;
                    num = Math.max(1, Math.min(max, baseNum + offset));
                }

                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            return numbers.sort((a, b) => a - b);
        }

        function generateTicket() {
            const maxWhite = currentGame === 'powerball' ? 69 : 70;
            const maxBonus = currentGame === 'powerball' ? 26 : 25;

            let numbers;
            
            // Generate based on mode
            if (currentMode === 'random') {
                // TRULY RANDOM - any number from 1 to maxWhite with equal probability
                numbers = generateTrulyRandom(maxWhite, 5);
            } else {
                // HOT NUMBERS MODE - biased toward historically frequent numbers
                numbers = generateHotBiased(maxWhite, 5);
            }

            // Generate bonus ball
            let bonus;
            if (currentMode === 'hot' && Math.random() < 0.7) {
                const hotBonus = hotNumbers[currentGame].bonus;
                bonus = hotBonus[Math.floor(Math.random() * Math.min(5, hotBonus.length))];
            } else {
                bonus = Math.floor(Math.random() * maxBonus) + 1;
            }

            // Animate and display
            animateNumbers(numbers, bonus);

            // Save ticket
            const ticket = {
                game: currentGame,
                mode: currentMode,
                numbers: numbers,
                bonus: bonus,
                date: new Date().toLocaleString()
            };

            tickets.unshift(ticket);
            if (tickets.length > 20) tickets.pop();
            localStorage.setItem('lotteryBanditTickets', JSON.stringify(tickets));

            ticketCount++;
            document.getElementById('ticketCount').textContent = ticketCount;

            renderTicketHistory();
        }

        function animateNumbers(numbers, bonus) {
            const display = document.getElementById('numbersDisplay');
            const bonusClass = currentGame === 'powerball' ? 'powerball' : 'megaball';

            display.innerHTML = '';
            numbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'number-ball white-ball';
                ball.textContent = num;
                display.appendChild(ball);
            });

            const bonusBall = document.createElement('div');
            bonusBall.className = `number-ball ${bonusClass}`;
            bonusBall.textContent = bonus;
            display.appendChild(bonusBall);
        }

        function renderTicketHistory() {
            const history = document.getElementById('ticketHistory');
            if (tickets.length === 0) {
                history.innerHTML = '';
                return;
            }

            history.innerHTML = '<h2 style="color: #ffd700; margin-bottom: 15px;">📋 Recent Tickets</h2>';

            tickets.slice(0, 10).forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';

                const gameName = ticket.game === 'powerball' ? 'Powerball' : 'Mega Millions';
                const bonusClass = ticket.game === 'powerball' ? 'powerball' : 'megaball';
                const modeName = ticket.mode === 'random' ? 'Random' : 'Hot';

                card.innerHTML = `
                    <div style="color: #ff6b6b; font-weight: bold;">${gameName} (${modeName}) - ${ticket.date}</div>
                    <div class="ticket-numbers">
                        ${ticket.numbers.map(n => `<div class="small-ball white-ball">${n}</div>`).join('')}
                        <div class="small-ball ${bonusClass}">${ticket.bonus}</div>
                    </div>
                `;

                history.appendChild(card);
            });
        }

        // Initialize
        renderTicketHistory();

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .catch(err => console.log('Service worker registration failed:', err));
        }
    </script>
</body>
</html>
